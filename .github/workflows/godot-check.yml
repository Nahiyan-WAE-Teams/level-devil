name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Run gameplay smoke test
        run: godot --headless --path . --script tests/smoke_test.gd --quit-after 180
